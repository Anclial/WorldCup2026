<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>World Cup 2026 — 6-Team Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://firebase.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div
      id="loading-overlay"
      class="loading-overlay"
      role="alertdialog"
      aria-modal="true"
      aria-busy="true"
      aria-live="assertive"
      aria-label="Loading"
    >
      <div class="loading-overlay-inner">
        <div class="loading-spinner" aria-hidden="true">
          <div class="loading-spinner-ring"></div>
          <span class="loading-spinner-icon">🏆</span>
        </div>
        <p class="loading-title">LOADING</p>
        <p class="loading-message">Loading contest data…</p>
        <p class="loading-hint">Usually just a few seconds — scores may update quietly in the background</p>
      </div>
    </div>

    <div id="app">
      <header class="header">
        <div class="header-inner">
          <div class="brand">
            <span class="brand-icon" aria-hidden="true">🏆</span>
            <div>
              <h1>World Cup 2026</h1>
              <p class="subtitle">6-Team Challenge</p>
            </div>
          </div>
          <div id="user-bar" class="user-bar hidden"></div>
        </div>
      </header>

      <main class="main">
        <div id="toast" class="toast hidden" role="status"></div>
        <div id="error" class="error-banner hidden"></div>

        <section id="welcome-section" class="card welcome-card">
          <h2 class="welcome-title">Welcome to the World Cup 2026 Contest</h2>
          <p class="welcome-subtitle">How do you know Jason?</p>
          <div id="circle-picker" class="circle-picker"></div>
        </section>

        <section id="login-section" class="card login-card hidden">
          <button type="button" id="back-to-welcome" class="btn btn-ghost btn-sm back-btn">← Change group</button>
          <p id="selected-circle-badge" class="selected-circle-badge hidden"></p>
          <h2>Join the Contest</h2>
          <p class="login-desc">Enter your first name only.</p>
          <form id="login-form" class="login-form">
            <label>
              First name
              <input
                type="text"
                id="name-input"
                required
                autocomplete="given-name"
                placeholder="e.g. Matt"
                maxlength="24"
              />
            </label>
            <button type="submit" class="btn btn-primary">Continue</button>
          </form>
        </section>

        <nav id="tabs" class="tabs hidden">
          <button class="tab active" data-tab="board">My Roster</button>
          <button class="tab" data-tab="leaderboard">Leaderboard</button>
          <button class="tab" data-tab="bracket">Bracket</button>
          <button class="tab" data-tab="everyone">All Rosters</button>
          <button class="tab" data-tab="rules">Rules</button>
          <button class="tab" data-tab="odds">Odds</button>
        </nav>

        <div id="board-header-slot" class="board-header-bar hidden"></div>

        <section id="board-section" class="hidden"></section>
        <section id="leaderboard-section" class="hidden"></section>
        <section id="bracket-section" class="hidden"></section>
        <section id="everyone-section" class="hidden"></section>
        <section id="rules-section" class="hidden"></section>
        <section id="odds-section" class="hidden"></section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
